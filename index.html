          <span class="brand-copy"><strong>Santuario Ω</strong><small id="sceneName">Campamento</small></span>
        </div>
        <div class="hud-status" aria-live="polite">

          <span class="status-chip"><span aria-hidden="true">✦</span><strong id="hintCount">1</strong><small>pistas</small></span>

          <button id="menuButton" class="icon-button" type="button" aria-label="Abrir menú" title="Menú">☰</button>
        </nav>
      </header>
      <main id="gameMain" class="game-main">
        <section id="sceneFrame" class="scene-frame" aria-label="Escenario explorable" tabindex="-1">

          <div id="hotspots" class="hotspots" aria-label="Objetos interactivos del escenario"></div>
          <div class="scene-caption" aria-hidden="true">
            <span id="sceneKicker">EXPEDICIÓN ARRIAGA</span>
            <strong id="sceneTitle">Campamento abandonado</strong>
          </div>

          <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
        </section>
      </main>
      <section id="dialogue" class="dialogue" aria-live="polite" hidden>

  const beep = (frequency = 390, duration = 0.05, gain = 0.025) => {
    if (!state.settings.sound) return;
    try {
      audioContext ||= new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioContext.createOscillator();
      const volume = audioContext.createGain();
      oscillator.type = "sine";
      oscillator.frequency.value = frequency;
      volume.gain.value = gain;
      oscillator.connect(volume);
      volume.connect(audioContext.destination);
      oscillator.start();
      volume.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration);
      oscillator.stop(audioContext.currentTime + duration);
    } catch (_error) {
      state.settings.sound = false;
    }
  };
  const fadeOutAudio = (audioElement, duration = 1500) => {
  if (!audioElement || audioElement.paused) return;
  
  const stepTime = 50; // Cada cuánto tiempo bajamos el volumen (milisegundos)
  const steps = duration / stepTime;
  const volumeStep = audioElement.volume / steps;

  const fadeInterval = setInterval(() => {
    if (audioElement.volume > volumeStep) {
      audioElement.volume -= volumeStep;
    } else {
      audioElement.volume = 0;
      audioElement.pause();
      audioElement.currentTime = 0;
      audioElement.volume = 1; // Restauramos el volumen original para la próxima reproducción
      clearInterval(fadeInterval);
    }
  }, stepTime);
};

      };

      modalRoot.querySelectorAll("[data-rule-tile]").forEach((button) => {
      button.addEventListener("dragstart", (event) => event.dataTransfer.setData("text/plain", button.dataset.ruleTile));
      button.addEventListener("click", () => {
        selectedRuleTile = button.dataset.ruleTile;
        modalRoot.querySelectorAll("[data-rule-tile]").forEach((item) => item.classList.toggle("selected", item === button));
        button.setAttribute("aria-pressed", "true");
        const fb = el("axiomFeedback");
        if (fb) fb.textContent = "Tablilla seleccionada. Ahora tocá uno de los tres destinos.";
        });
      });
      modalRoot.querySelectorAll("[data-rule-zone]").forEach((zone) => {
      zone.addEventListener("dragover", (event) => { event.preventDefault(); zone.classList.add("over"); });
      zone.addEventListener("dragleave", () => zone.classList.remove("over"));
      zone.addEventListener("drop", (event) => { event.preventDefault(); place(event.dataTransfer.getData("text/plain"), zone.dataset.ruleZone); });
      zone.addEventListener("click", () => place(selectedRuleTile, zone.dataset.ruleZone));
      });

      el("clearAxiom")?.addEventListener("click", () => { state.axiom.placements = {}; selectedRuleTile = null; save(); openAxiomPuzzle(); });
    el("checkAxiom")?.addEventListener("click", () => {
      state.axiom.attempts += 1;
      const correct = ["event", "whole", "disjoint"].every((zone) => axiomRules.find((rule) => rule.id === state.axiom.placements[zone])?.zone === zone);
      save();
      if (correct) {
        if (!state.seals.axiom) {
          state.seals.axiom = true;
          
          save();
        }
        closeModal();
        goTo("axiom_2", "<i>¡La puerta se ha abierto!</i>");
       
      } else {
        const filled = Object.keys(state.axiom.placements).length;
        openAxiomPuzzle(filled < 3 ? "Todavía hay ranuras vacías. Cada regla describe un comportamiento distinto de la balanza." : "Alguna tablilla contradice lo que acabás de observar. Recordá que la suma directa exige rutas incompatibles.", "bad");
      }
    });
  };
  

  /* ---------- Final ---------- */
  const openEnding = () => {

    // --- REPRODUCIR AUDIO EN EL MODAL ---
    const finalAudio = document.getElementById("finalAudio");
    if (finalAudio && state.settings.sound) {
      finalAudio.play().catch(() => {});
    }
    // -------------------------------------

    state.endingSeen = true;
    save();
    openModal(`${modalHeader("CÁMARA DEL HORIZONTE", "El verdadero legado")}
      <div class="modal-body">
        <p class="modal-intro">Las siete llaves encajan. El contrapeso libera a Arraiga y la primera luz del amanecer atraviesa el archivo mecánico.</p>
        <div class="seal-row">${Object.values(state.seals).map(() => '<span class="seal-dot on">✓</span>').join("")}</div>
        <div class="feedback good">Completaste la expedición usando Laplace, espacio muestral, suma de dados, diagrama de árbol, frecuencia relativa, creencia subjetiva y axiomas.</div>
        <div class="modal-actions">          
          <button class="button primary" type="button" id="activarSalida">Activar palanca</button>
          </div>
      </div>`, "wide");

   el("activarSalida").addEventListener("click", () => {
      // 1. Cerramos la ventana modal del final primero
      closeModal();
      
      // 2. Actualizamos la escena de fondo y la guardamos
      state.currentScene = "vault2";
      save();
      renderScene();
      
      // 3. Disparamos la cadena de diálogos de León Arraiga
      showDialogue(
        "León Arraiga", 
        "<i>No sabes cuánto te agradezco, joven</i>", 
        () => {
          showDialogue(
            "León Arraiga", 
            "<i>Creí que Tharum había construido un oráculo. Pero en realidad construyó una defensa <strong>contra la certeza falsa</strong>. No enseña qué va a ocurrir... enseña a pensar cuando no podemos saberlo.</i>", 
            () => {                
              showDialogue(
                "León Arraiga", 
                "<i>¡Vamos! Salgamos de una vez de aquí</i>",
                () => {
                  goTo("vault3");
                }
              ); 
            }
          ); 
        }
      );
    });
  };
  // CREDITOS FINALES
  const openCreditsModal = () => {
    openModal(`
      <div class="intro-modal">
        <div class="modal-body">
          
          <h1 class="intro-title">Gracias por jugar<span>Santuario Ω : Las ruinas de Tharum</span></h1>
          <div class="intro-story-grid">
            <img class="intro-image2" src="${assetSrc("jungle-intro.webp")}" alt="Selva húmeda de Indonesia" />
            <div>
              <h3 style="margin-top: 0; color: #f2cb73;">Créditos a</h3>
              <p class="modal-intro" style="margin-bottom: 15px;">
                Macchia Juan<br>
                Orquera Melany<br>
                Ortiz Liliana
              </p>
              <h3 style="color: #f2cb73;">Profesor</h3>
              <p class="modal-intro">
                Santiago Fiore
              </p>
              <h3 style="color: #f2cb73;">Materia</h3> 
              <p class="modal-intro">Modelización</p>
            </div>
          </div>
          
          <div class="modal-actions" style="margin-top: 25px; justify-content: flex-end;">
            <button class="button primary" type="button" id="replayGame">Volver a jugar</button>
          </div>
        </div>
      </div>
    `, "wide");

    // Evento para reiniciar el juego al presionar "Volver a jugar"
    el("replayGame")?.addEventListener("click", () => {
      resetGame(false); // Reinicia todo el progreso
    });
  };

  ///SECCION DIALOGOS 

  const handleAction = (action) => {
    beep(390, .045);
    const actions = {
      ///CAMPAMENTO
      journal: () => {
        state.journalTaken = true; state.notesUnlocked = Math.max(0, state.notesUnlocked); save();
        
        showDialogue(
        "Cuaderno de Arraiga", 
        "<i>Según lo que dice este cuaderno, León Arraiga es un arqueólogo, quién parece que intentaba descubrir una especie de antigua civilización. Hay más notas aquí...</i>", 
        () => {
            // Esta función se ejecuta justo cuando el jugador cierra el primer diálogo
            showDialogue(
                "Nota del cuaderno", 
                "Día 1: “¡Por fin encontré las ruinas de Tharum! Mis colegas se niegan a venir. Tendré que arreglármelas solo.” Día 2: “Si alguien encuentra estas páginas, no confunda una posibilidad con una certeza.” Firma: León Arraiga"
            );
          }
        );       
      },
      radio: () => showDialogue("Radio averiada", "Grabación: “Arraiga, la tormenta... [interferencia]... llega al valle... Responda. No entre solo.”"),
      lantern: () => showDialogue("Linterna", "<i>Todavía está tibia. ¿Qué pasó?.</i>"),
      backpack: () => showDialogue("Mochila", "<i>Parece que hay un listado de cosas que indican que esta persona se llevo consigo una cantimplora, una cuerda y un medallón. ¿seguirá viva?</i>"),
      enter: () => {
        if (!state.journalTaken) { showDialogue("Instinto", "<i>No quiero entrar sin saber a qué me enfrento. Debería leer el cuaderno abierto sobre el baúl.</i>"); revealHotspots(); }
        else if (!state.tentNotesRead) { showDialogue("Instinto", "<i>El cuaderno menciona más notas dentro de la tienda. Debería leerlas antes de cruzar el umbral.</i>"); revealHotspots(); }
        else goTo("central", "Al entrar, no te das cuenta pero pisas un bloque que se hunde y entonces la puerta se cierra: Para avanzar tienes que recuperar las 3 llaves de esta sala.");
      },
     
      /// DENTRO DE LA TIENDA DE ARRAIGA
      enterTent: () => goTo("tent", "<i>Parace que esta persona 'León' estaba investigando algo aquí</i>"),
      tentMap: () => { state.tentMapRead = true; save(); showDialogue("Mapa de la expedición", "Varias fotografías de templos antiguos con una anotación: “Tharum no es una leyenda”."); },
      tentNotes: () => { state.tentNotesRead = true; save(); showDialogue("Notas de León", "El grupo exigía por lo menos un 50 % de seguridad antes de financiar el viaje. León interpretó un indicio como certeza y partió solo. En otra hoja escribió: “Experimento aleatorio: conozco los resultados posibles, pero no puedo predecir con certeza cuál ocurrirá”."); },
      tentBooks: () => showDialogue("Libros y manuscritos", " “A lo sumo”, “al menos” y “espacio muestral Ω”, son palabras subrayadas. Cada palabra cambia qué resultados pertenecen a un suceso."),
  
      // NUEVA ACCIÓN PARA LA NETBOOK (TUTORIALES)
      openTutorials: () => {
        openModal(`
          <div class="modal-header">
            <div>              
              <h2>Tutoriales y ayudas</h2>
            </div>
            <button class="close-modal" type="button" data-close-modal aria-label="Cerrar">×</button>
          </div>
          <div class="modal-body">
            <p class="modal-intro">Si deseas puedes ver de antemano los temas abordados dentro del juego:</p>
            <p style="margin-top: 20px;">
              <a href="https://www.youtube.com/watch?v=UN9AgGbGlX8" target="_blank" rel="noopener noreferrer" style="color: var(--bronze-bright); font-weight: bold; text-decoration: underline;">
                Regla Laplace ↗
              </a>
              <br>
              <a href="https://www.youtube.com/watch?v=7Fz8yu1Lhj8" target="_blank" rel="noopener noreferrer" style="color: var(--bronze-bright); font-weight: bold; text-decoration: underline;">
                Probabilidad al lanzar 2 dados ↗
              </a>
              <br>
              <a href="https://www.youtube.com/watch?v=OpnuzWQKq3s" target="_blank" rel="noopener noreferrer" style="color: var(--bronze-bright); font-weight: bold; text-decoration: underline;">
                Diagrama de árbol ↗
              </a>
               <br>
              <a href="https://www.youtube.com/watch?v=OpnuzWQKq3s" target="_blank" rel="noopener noreferrer" style="color: var(--bronze-bright); font-weight: bold; text-decoration: underline;">
                Propiedades de la probabilidad ↗
              </a>
            </p>
          </div>
        `, "narrow");
      },

      /// PUZZLE 01 y 04
      centralDoor1: () => {
        if (state.currentScene === "central_2") {
          // Sala 2: Puzzle 04
          if (state.seals.dice) {
            showToast("El Puzzle 04 ya ha sido completado.", "bad");
          } else {
            goTo("dice", "");
          }
        } else {
          // Sala 1: Puzzle 01 (Laplace)
          if (state.seals.laplace) {
            showToast("El Puzzle 01 ya ha sido completado y su acceso está cerrado.", "bad");
          } else {
            goTo("laplace", "<i>Mmnm parece un altar.. Hay una inscripción que destaca la palabra CIELO.</i>");
          }
        }
      },
      
      /// PUZZLE 02 y 05
      centralDoor2: () => {
        if (state.currentScene === "central_2") {
          // Sala 2: Puzzle 05
          if (!state.seals.dice) {
            showToast("La puerta del Puzzle 05 está bloqueada. Debes completar el Puzzle 04 primero.", "bad");
          } else if (state.seals.coin) {
            showToast("El Puzzle 05 ya ha sido completado.", "bad");
          } else {
            goTo("coin", "");
          }
        } else {
          // Sala 1: Puzzle 02 (DiceSum)
          if (!state.seals.laplace) {
            showToast("La segunda puerta necesita la llave del Puzzle 1.", "bad");
          } else if (state.seals.diceSum) {
            showToast("El Puzzle 02 ya ha sido completado", "bad");
          } else {
            goTo("diceSum", "Una pared con varios dados incrustados mostrando un patrón.");
          }
        }
      },

      /// PUZZLE 03 y 06
      centralDoor3: () => {
        if (state.currentScene === "central_2") {
          // Sala 2: Puzzle 06
          if (!state.seals.coin) {
            showToast("La puerta del Puzzle 06 está bloqueada. Debes completar el Puzzle 05 primero.", "bad");
          } else if (state.seals.subjective) {
            showToast("El Puzzle 06 ya ha sido completado.", "bad");
          } else {
            goTo("subjective", "Hay indicios que de probablemente Arraiga estuvo por aquí");
          }
        } else {
          // Sala 1: Puzzle 03 (Tree)
          if (!state.seals.diceSum) {
            showToast("La tercera puerta necesita la llave del Puzzle 2.", "bad");
          } else if (state.seals.tree) {
            showToast("El Puzzle 03 ya ha sido completado.", "bad");
          } else {
            goTo("tree", "La escritura en la pared parece importante, tomaré nota de ello.");
          }
        }
      },
      
      laplacePuzzle: () => {
        if (state.seals.laplace) {
          showToast("El Puzzle 01 ya ha sido completado y su acceso está cerrado.", "bad");
        } else {
          openLaplacePuzzle();
        }
      },   

      diceSumPuzzle: () => {
        if (state.seals.diceSum) {
          showToast("El Puzzle 02 ya ha sido completado y su acceso está cerrado.", "bad");
        } else{
          openDiceSumPuzzle();          
        }       
      },
      treePuzzle: openTreePuzzle,      
      goCentral: () => goTo(foundationalRouteSolved() ? "central_2" : "central"),
      map: openMap,
      centralDoorNext: () => {
        if (!foundationalRouteSolved()) {
          showToast(
            `La puerta central exige las tres llaves iniciales. Tienes ${[
              state.seals.laplace,
              state.seals.diceSum,
              state.seals.tree
            ].filter(Boolean).length} de 3.`,
            "bad"
          );
        } else {
          goTo(
            "central_2",
            "Para avanzar se debe completar los puzzles de esta sala"
          );
        }
      },

      vault: () => {
        showDialogue(
          "Tú", 
          "<i>¡He encontrado a León Arraiga! ¡Oiga! ¿se encuentra bien?</i>", 
          () => {
            showDialogue(
              "León Arraiga", 
              "<i>¡Gracias a Dios! ¿Cómo me has encontrado?</i>", 
              () => {
                showDialogue(
                  "Tú", 
                  "<i>No ha sido nada facil pero he leído sus pistas en el campamento y a lo largo de las Ruinas</i>", 
                  () => {
                    showDialogue(
                      "León Arraiga", 
                      "<i>Me alegro de que no te hayas quedado atrapado en alguna trampa</i>", 
                      () => {
                        showDialogue(
                          "Tú", 
                          "<i>Lo sacaré enseguida no se preocupe.</i>" );}
                    ); }                );              }            );          }       
        );
  // Nos aseguramos de renderizar la escena de la cámara del horizonte por detrás
  state.currentScene = "vault";
  save();
  renderScene();
  },

  vault2: () => {
        showDialogue(
          "León Arraiga", 
          "<i>No sabes cuanto te agradezco joven</i>", 
          () => {
            showDialogue(
              "León Arraiga", 
              "<i>Creí que Tharun había construido un oráculo. Pero en realidad construyó una defensa <strong>contra la certeza falsa</strong>.No enseña qué va a ocurrir... enseña a pensar cuando no podemos saberlo.</i>", 
              () => {                
                    showDialogue(
                      "León Arraiga", 
                      "<i>¡Vamos! Salgamos de una vez de aquí</i>",
                        () => {
                          goTo("vault3");
                         }
                      ); }                );              }            );     
  state.currentScene = "vault2";
  save();
  renderScene();
  },

      centralMechanism: () => {
        if (!advancedCoreSolved()) {
          showToast(
            `El mecanismo exige completar los puzzles de la sala, tienes ${[
              state.seals.dice,
              state.seals.coin,
              state.seals.subjective
            ].filter(Boolean).length} de 3.`,
            "bad"
          );
        } else if (!state.seals.axiom) {
          goTo("axiom", "<i>Parece que detrás de la balanza hay una especie de puerta...</i>");
        } else {
          goTo("vault", "El medallón Ω está completo. Detrás del muro se escucha una voz humana.");
        }
      },
      dicePuzzle: openDicePuzzle,
      coinPuzzle: openCoinPuzzle,
      subjectivePuzzle: openSubjectivePuzzle,
      axiomPuzzle: openAxiomPuzzle,
      finalpuzzle: openEnding,
      
      chestDice: () => openReward("dice"),
      chestCoin: () => openReward("coin"),
      chestSubjective: () => openReward("subjective"),
      chestAxiom: () => openReward("axiom"),
      
      arriaga: () => showDialogue("León Arraiga", "<i>Debes activar la palanca que está ahí</i>"),
      archive: () => showDialogue("Archivo mecánico", "Miles de discos registran experimentos repetidos: monedas, dados, urnas y rutas. El tesoro de Tharun es un archivo de decisiones, no una profecía."),
      finalNote: () => showDialogue("Última nota", "“Si otra persona llega, habrá comprendido los siete mecanismos. Sólo entonces la palanca será segura.”"),
      finalLever: () => { if (sealCount() === 7) openEnding(); else showToast("Faltan llaves en el receptáculo.", "bad"); },
      
      escape: () => {openCreditsModal();
    },
          
    };
    actions[action]?.();
  };

  const bindGlobalEvents = () => {
    el("dialogueClose").addEventListener("click", hideDialogue);
    el("revealButton").addEventListener("click", revealHotspots);
    el("hintButton").addEventListener("click", useHint);
    el("notebookButton").addEventListener("click", () => openNotebook());

    el("soundButton").addEventListener("click", () => { 
      state.settings.sound = !state.settings.sound; 
      save(); 
      updateHud(); 

      const ambientAudio = document.getElementById("ambientAudio");
      const ruinaAudio = document.getElementById("ruinaAudio");
      const nivel06Audio = document.getElementById("nivel06Audio");
      const finalAudio = document.getElementById("finalAudio");

      if (state.settings.sound) {
        beep(520, .06);
        if (ambientAudio && (state.currentScene === "camp" || state.currentScene === "tent")) ambientAudio.play().catch(() => {});
        if (ruinaAudio && ["central", "central_puertaA", "central_2", "central_2puerta"].includes(state.currentScene)) ruinaAudio.play().catch(() => {});
        if (nivel06Audio && (state.currentScene === "subjective" || modalRoot.innerHTML.includes("belief-lab"))) nivel06Audio.play().catch(() => {});
        if (finalAudio && (state.currentScene === "vault" || state.currentScene === "vault2" || state.currentScene === "vault3")) finalAudio.play().catch(() => {});
         
      } else {      

        if (ambientAudio) fadeOutAudio (ambientAudio, 1000); 
        if (ruinaAudio) fadeOutAudio (ruinaAudio, 1000); 
        if (nivel06Audio) fadeOutAudio (nivel06Audio, 1000); 
        if (finalAudio) fadeOutAudio (finalAudio, 1000); 
      }
    });

    el("menuButton").addEventListener("click", openMenu);
    el("backButton").addEventListener("click", () => {
    // Si estás en la tienda, vuelves al campamento. 
    // Si estás en un puzzle, vuelves a central_2 si ya completaste los 3 primeros, o a central si no.
    if (state.currentScene === "tent") {
        goTo("camp");
        
      } else {
        goTo(foundationalRouteSolved() ? "central_2" : "central");
      }
    });
    modalRoot.addEventListener("click", (event) => { if (event.target.matches("[data-close-modal]")) closeModal(); });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (modalRoot.innerHTML) closeModal(); else if (!dialogueEl.hidden) hideDialogue(); else openMenu();
    });
    let previousPortrait = isPortrait();
    window.addEventListener("resize", () => {
      const nowPortrait = isPortrait();
      if (nowPortrait !== previousPortrait) { previousPortrait = nowPortrait; renderScene(); }
    });
  };

  const boot = () => {
    state.settings.reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    bindGlobalEvents();
    
    // --> CONFIGURACIÓN DEL BUCLE FLUIDO PARA EL AUDIO AQUÍ <--
    const ambientAudio = document.getElementById("ambientAudio");
    if (ambientAudio) {
      ambientAudio.addEventListener("timeupdate", () => {
        if (ambientAudio.duration && ambientAudio.currentTime >= ambientAudio.duration - 0.17) {
          ambientAudio.currentTime = 0;
          ambientAudio.play().catch(() => {});
        }
      });
    }
   
    // --------------------------------------------------------

    renderScene();
    if (!storageAvailable) setTimeout(() => showToast("El guardado local no está disponible; la sesión seguirá funcionando.", "bad"), 900);
    openIntro();
  };

  boot();
})();

</script>
  </body>
</html>
